[GoCI]
# How often (minutes) to check the DNS.
#   0  = one-shot mode  → use with a cron job
#   >0 = daemon mode    → use with a systemd service (runs every N minutes)
TTL_MINUTES_CHECK_DNS_ENTRIES = 5

# If true, always push the update to the enabled providers even when the IP has not changed.
IGNORE_OLD_IP = false

# Hostname that is resolved (like pinging it) to discover the current public IP.
# Ignored when USE_IP_DISCOVERY = true.
DOMAIN_TO_RESOLVE = example.org

# Opt-in: if true, get the public IPv4 from an HTTP service instead of
# resolving DOMAIN_TO_RESOLVE. The service must return the bare IP as text.
USE_IP_DISCOVERY = false

# HTTP(S) service used when USE_IP_DISCOVERY = true (default: https://api.ipify.org).
IP_DISCOVERY_URL = https://api.ipify.org

# If true, push NEW_IP to the enabled providers instead of the resolved address.
OVERRIDE_NEW_IP = false

# Static IP to use when OVERRIDE_NEW_IP = true.
NEW_IP = 0.0.0.0

# Enable IONOS DNS updates (true/false).
ENABLE_IONOS = false

# Enable Cloudflare DNS updates (true/false).
ENABLE_CLOUDFLARE = true



[CF]
# API token with "Zone – DNS – Edit" permission on every zone below.
CF_TOKEN = your-cloudflare-api-token

# Account ID (optional, currently unused, reserved for future use).
CF_ACCOUNT_ID = your-account-id

# Zones and the A record IDs to update in each of them:
#   <zone id>:<record id>,<record id>;<zone id>:<record id>
# Do not put a space before ';' (" ;" starts a comment).
# Run "goci-dns setup" or see docs/SETUP.md to find the IDs.
CF_ZONES = your-zone-id:123456789qwerty,123456789asdfgh;your-other-zone-id:987654321zxcvbn

# Optional: per-zone tokens that replace CF_TOKEN, e.g. for zones in another
# Cloudflare account. Format: <zone id>:<token>;<zone id>:<token>
# CF_ZONE_TOKENS = your-other-zone-id:your-other-cloudflare-api-token

# Deprecated single-zone keys, still supported (they add one more zone):
# CF_ZONE_ID = your-zone-id
# CF_DNS_ENTRIES_ID = 123456789qwerty,...



[IONOS]
# API URL for IONOS DNS API (default: https://api.hosting.ionos.com/dns).
IONOS_API_URL = https://api.hosting.ionos.com/dns

# API key in the form <public prefix>.<secret>.
IONOS_API_KEY = your-ionos-api-key

# Zones and the A record IDs to update in each of them (same format as CF_ZONES).
IONOS_ZONES = your-ionos-zone-id:123456789qwerty,...

# Optional: per-zone API keys that replace IONOS_API_KEY.
# Format: <zone id>:<prefix>.<secret>;<zone id>:<prefix>.<secret>
# IONOS_ZONE_API_KEYS = your-other-ionos-zone-id:your-other-ionos-api-key

# Deprecated single-zone keys, still supported (they add one more zone):
# IONOS_ZONE_ID = your-ionos-zone-id
# IONOS_DNS_ENTRIES_ID = 123456789qwerty,...
