name: Build, Release & Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ========== Build GoCI-DNS ==========
  build:
    name: Build Golang App
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifacts: ${{ steps.build.outputs.artifacts }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=dev-$(date +%Y%m%d-%H%M%S)
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Build binaries
        id: build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ./dist

          TARGETS="amd64 arm64 386 arm:6 arm:7"

          for target in $TARGETS; do
            arch=${target%%:*}
            armv=""
            [[ "$target" == *:* ]] && armv=${target#*:}

            out="./dist/goci-dns-linux-${arch}${armv:+v${armv}}"
            echo "Building ${out}"
            GOOS=linux GOARCH=$arch GOARM=$armv go build \
              -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
              -o "$out" .
          done

          ls -lah ./dist/
          echo "artifacts=./dist" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd ./dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binaries
          path: dist/
          retention-days: 1

  # ========== GitHub Release ==========
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: binaries
          path: dist/

      - name: Create release notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## Changelog
          
          - Build version: ${{ needs.build.outputs.version }}
          - Built with Go 1.27
          
          ### Binaries included:
          - Linux x86_64 (amd64)
          - Linux x86 32-bit (386)
          - Linux ARM64 (aarch64) - Raspberry Pi 3/4/5 with 64-bit OS
          - Linux ARMv7 (armv7) - Raspberry Pi 2/3/4 with 32-bit OS and most SBCs
          - Linux ARMv6 (armv6) - Raspberry Pi Zero/Zero W/1
          EOF
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            dist/goci-dns-*
            dist/SHA256SUMS
          bodyFile: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========== Docker Image ==========
  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: binaries
          path: dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build args
        id: build_args
        run: |
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,enable=${{ github.ref.type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref.type == 'tag' }}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=sha,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ needs.build.outputs.version }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.build
          platforms: linux/amd64,linux/arm64,linux/386,linux/arm/v7,linux/arm/v6
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            BUILD_DATE=${{ steps.build_args.outputs.build_date }}

      - name: Create per-arch tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${GITHUB_REPOSITORY,,}"
          PLATFORMS="linux/amd64:amd64 linux/arm64:arm64 linux/386:386 linux/arm/v7:armv7 linux/arm/v6:armv6"

          for entry in $PLATFORMS; do
            platform=${entry%%:*}
            suffix=${entry#*:}
            args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && args+=(-t "${tag}-${suffix}")
            done <<< "$TAGS"

            echo "Tagging ${platform}: ${args[*]}"
            docker buildx imagetools create --platform "$platform" "${args[@]}" "${IMAGE}@${DIGEST}"
          done

      - name: Image digest
        run: |
          echo "Image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"